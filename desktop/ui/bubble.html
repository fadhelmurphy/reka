<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
  .wrap { position:absolute; inset:6px; border-radius:50%; overflow:hidden; border:4px solid #625df5; background:#111; box-shadow:0 4px 18px #0007; }
  video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  /* covers the whole bubble so it can be dragged anywhere on screen */
  .drag { position:absolute; inset:0; cursor:grab; }
</style>
</head>
<body>
  <div class="wrap"><video id="v" autoplay muted playsinline></video></div>
  <div class="drag" data-tauri-drag-region title="Seret untuk memindah · klik dua kali untuk ganti ukuran"></div>
<script>
const { listen } = window.__TAURI__.event;
const { getCurrentWindow, LogicalSize } = window.__TAURI__.window;
const v = document.getElementById('v');
let stream = null;

async function open(cam) {
  stop();
  if (!cam) return;
  const { id, label } = JSON.parse(cam);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: id }, width: 640, height: 640 } });
  } catch {
    // deviceIds can differ between webviews; fall back to matching by label, then any camera.
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const m = cams.find(c => c.label === label);
    stream = await navigator.mediaDevices.getUserMedia({ video: m ? { deviceId: { exact: m.deviceId } } : true });
  }
  v.srcObject = stream;
}
function stop() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; v.srcObject = null; }

listen('bubble-camera', (e) => open(e.payload).catch(err => console.error(err)));

const sizes = [200, 280, 360]; let si = 0;
document.querySelector('.drag').addEventListener('dblclick', () => {
  si = (si + 1) % sizes.length;
  getCurrentWindow().setSize(new LogicalSize(sizes[si], sizes[si]));
});
</script>
</body>
</html>
