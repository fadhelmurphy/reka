[package]
name = "reka-desktop"
version = "0.1.0"
edition = "2021"
description = "Reka desktop recorder"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reka-server = { path = "../server" }
reka-studio = { path = "../studio" }
rdev = "0.5"
base64 = "0.22"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "stream", "rustls-tls", "json"] }
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
