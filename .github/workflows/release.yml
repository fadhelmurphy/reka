name: Release installers

# Push a tag like v0.1.0 (or run manually) to build installers for all OSes.
# They land in a *draft* GitHub Release; publish it when you're happy.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,     ffmpeg: darwin-arm64 } # Apple Silicon
          - { os: macos-latest,   target: x86_64-apple-darwin,      ffmpeg: darwin-x64 }   # Intel Mac
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   ffmpeg: win32-x64 }
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, ffmpeg: '' }           # .deb/.rpm depend on distro ffmpeg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libx11-dev libxtst-dev libxi-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle ffmpeg
        if: matrix.ffmpeg != ''
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh ${{ matrix.ffmpeg }} ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx -y @tauri-apps/cli@2
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: Reka ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseBody: |
            Installer Reka.
            - **macOS**: `.dmg` (aarch64 = Apple Silicon, x64 = Intel). Belum di-notarize: klik kanan → Open, atau `xattr -cr /Applications/Reka.app`.
            - **Windows**: `-setup.exe` (NSIS) atau `.msi`. SmartScreen: More info → Run anyway.
            - **Linux**: `.deb` / `.rpm` (ffmpeg ikut terpasang dari repo distro) atau `.AppImage` (butuh ffmpeg di sistem).
          releaseDraft: true
          prerelease: false
