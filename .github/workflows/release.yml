name: Release installers

# Push tag seperti v0.2.0 (atau jalankan manual) untuk membangun installer semua OS.
# Hasilnya masuk ke GitHub Release berstatus draft.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,     ffmpeg: darwin-arm64, formats: dmg }
          - { os: macos-13,       target: x86_64-apple-darwin,      ffmpeg: darwin-x64, formats: dmg }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   ffmpeg: win32-x64, formats: nsis }
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, ffmpeg: linux-x64, formats: 'deb,appimage' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependensi Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          echo "WHISPER_DONT_GENERATE_BINDINGS=1" >> "$GITHUB_ENV"  # binding bawaan hanya untuk Linux
          sudo apt-get install -y cmake libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libxdo-dev libxtst-dev libxi-dev libgtk-3-dev libfuse2 patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Bundel ffmpeg
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh ${{ matrix.ffmpeg }}

      - name: Pasang cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build binary
        run: cargo build --release -p reka-desktop --features whisper --target ${{ matrix.target }}

      - name: Package
        working-directory: desktop
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Reka ${{ github.ref_name }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          files: |
            target/**/*.exe
            target/**/*.dmg
            target/**/*.deb
            target/**/*.AppImage
